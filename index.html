<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>SGC - Sistema de Gestión de Contrataciones</title>
    
    <!-- Bootstrap y Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <!-- Fuente moderna (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap JS Bundle (incluye Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- SheetJS para importar/exportar Excel -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <!-- jsPDF para propuestas del portal de proveedores -->
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
    
    <!-- Estilos personalizados MEJORADOS -->
    <link rel="stylesheet" href="src/styles.css">
    
    <!-- CAMBIO 1: Estilos adicionales para garantizar visualización de submenús -->
    <style>
        /* Asegurar que los submenús sean visibles */
        .submenu-container {
            display: none;
        }
        .submenu-container[style*="display: block"] {
            display: block !important;
        }
        /* Mejorar la indentación visual de los submenús */
        .nav-submenu {
            list-style: none;
            padding-left: 24px !important;
            margin: 0;
        }
        .nav-subitem {
            margin: 4px 0;
        }
        .nav-sublink {
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .nav-sublink:hover {
            background-color: rgba(26, 115, 232, 0.08);
        }
        .nav-sublink.active {
            background-color: #e8f0fe;
            color: #1a73e8;
        }
        .chevron, .chevron-sub {
            margin-left: auto;
            transition: transform 0.2s;
        }
        .chevron.rotated, .chevron-sub.rotated {
            transform: rotate(180deg);
        }
    </style>
</head>
<body>
    <!-- Botón de menú responsive mejorado -->
    <button class="menu-toggle" id="menuToggle">
        <i class="bi bi-list"></i> Menú
    </button>
    
    <!-- Contenedor principal -->
    <div id="app"></div>
    
    <!-- Scripts -->
    <script type="module" src="/src/app.js"></script>
    
    <!-- Script para toggle del menú responsive -->
    <script>
        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.querySelector('.sidebar');
        
        if (menuToggle && sidebar) {
            menuToggle.addEventListener('click', () => {
                sidebar.classList.toggle('open');
            });
            
            // Cerrar menú al hacer clic fuera (opcional)
            document.addEventListener('click', (e) => {
                if (sidebar && menuToggle && !sidebar.contains(e.target) && !menuToggle.contains(e.target)) {
                    sidebar.classList.remove('open');
                }
            });
        }
    </script>
</body>
</html>
