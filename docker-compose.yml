# PostgreSQL para desarrollo local.
# Uso:  docker compose up -d
services:
  postgres:
    image: postgres:16
    container_name: sgc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sgc_db
    ports:
      - "5432:5432"
    volumes:
      - sgc_pgdata:/var/lib/postgresql/data

volumes:
  sgc_pgdata:
