<div class="container-fluid px-4">
    <div class="row mt-4">
        <div class="col-12">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">📋 Catálogo SIGAMEF</h4>
                </div>
                <div class="card-body">
                    <!-- Botones de acción -->
                    <div class="mb-3">
                        <button class="btn btn-primary" id="btnNuevoProducto">
                            <i class="fas fa-plus"></i> Nuevo Producto
                        </button>
                        <button class="btn btn-success" id="btnExportarCatalogo">
                            <i class="fas fa-file-excel"></i> Exportar a Excel
                        </button>
                        <button class="btn btn-info" id="btnImportarCatalogo">
                            <i class="fas fa-upload"></i> Importar desde Excel
                        </button>
                        <input type="file" id="archivoImportarCatalogo" accept=".xlsx, .xls, .csv" style="display: none;">
                    </div>

                    <!-- Tabla de productos -->
                    <div class="table-responsive">
                        <table class="table table-bordered table-hover" id="tablaCatalogo">
                            <thead class="table-light">
                                <tr>
                                    <th>Código</th>
                                    <th>Descripción</th>
                                    <th>Unidad</th>
                                    <th>Precio</th>
                                    <th>Ficha Técnica</th>
                                    <th>Acuerdo Marco</th>
                                    <th>Producto Controlado</th>
                                    <th>Ficha Homologada</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="catalogoBody">
                                <tr>
                                    <td colspan="9" class="text-center">Cargando productos...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal para Nuevo/Editar Producto -->
<div class="modal fade" id="modalProducto" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title" id="modalTitulo">Producto SIGAMEF</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="formProducto">
                    <input type="hidden" id="productoId" value="">
                    <div class="mb-3">
                        <label class="form-label">Código *</label>
                        <input type="text" class="form-control" id="codigo" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Descripción *</label>
                        <textarea class="form-control" id="descripcion" rows="2" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Unidad *</label>
                        <select class="form-select" id="unidad" required>
                            <option value="">Seleccionar...</option>
                            <option value="Unidad">Unidad</option>
                            <option value="Lote">Lote</option>
                            <option value="Kilogramo">Kilogramo</option>
                            <option value="Metro">Metro</option>
                            <option value="Servicio">Servicio</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Precio (S/) *</label>
                        <input type="number" step="0.01" class="form-control" id="precio" required>
                    </div>
                    <div class="mb-3">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="fichaTecnica">
                            <label class="form-check-label">Ficha Técnica</label>
                        </div>
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="acuerdoMarco">
                            <label class="form-check-label">Acuerdo Marco</label>
                        </div>
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="productoControlado">
                            <label class="form-check-label">Producto Controlado</label>
                        </div>
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="fichaHomologada">
                            <label class="form-check-label">Ficha Homologada</label>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary" id="btnGuardarProducto">Guardar</button>
            </div>
        </div>
    </div>
</div>
